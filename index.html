<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      title, meta description y og:title/og:description se generan por ruta
      con <Head> (react-helmet) en src/App.tsx, ya en el HTML pre-renderizado.
      Aquí solo quedan los metadatos comunes a todas las rutas.
    -->
    <!-- SEO Meta Tags -->
    <meta
      name="keywords"
      content="FASOR, protección civil, emergencias, rescate, ONG, Casa Alaniz, Castilla y León"
    />
    <meta name="author" content="FASOR - Fuerza de Auxilio, Soporte y Rescate" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />

    <!-- Favicon: el definitivo (generado a partir del sello FASOR) llega en la fase de pulido -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Tipografía propia Quantic Sci autoalojada; ver @font-face en src/index.css -->
    <link
      rel="preload"
      href="/fonts/QuanticSci-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/QuanticSciDisplay-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
