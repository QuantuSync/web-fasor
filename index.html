<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      title, meta description y og:title/og:description se generan por ruta
      con <Head> (react-helmet) en src/App.tsx, ya en el HTML pre-renderizado.
      Aquí solo quedan los metadatos comunes a todas las rutas.
    -->
    <!-- SEO Meta Tags -->
    <meta
      name="keywords"
      content="FASOR, protección civil, emergencias, rescate, ONG, Casa Alaniz, España"
    />
    <meta name="author" content="FASOR - Fuerza de Auxilio, Soporte y Rescate" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />

    <!-- Favicons generados a partir del sello FASOR (ver public/) -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Tipografía autoalojada (Saira Condensed + Inter); ver @font-face en src/index.css.
         Se precargan los pesos del primer render: Saira 700 (wordmark), 600 (etiquetas) e Inter. -->
    <link
      rel="preload"
      href="/fonts/saira-condensed-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/saira-condensed-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
